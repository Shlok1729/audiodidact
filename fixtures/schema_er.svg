<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <rect width="700" height="450" fill="#0b0f19"/>
  
  <!-- Repositories Table -->
  <g transform="translate(50, 50)">
    <rect width="240" height="180" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="240" height="35" rx="8" fill="#2563eb"/>
    <text x="20" y="24" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">repositories</text>
    <text x="20" y="65" fill="#e2e8f0" font-family="monospace" font-size="12">PK id: uuid</text>
    <text x="20" y="95" fill="#e2e8f0" font-family="monospace" font-size="12">   owner: varchar</text>
    <text x="20" y="125" fill="#e2e8f0" font-family="monospace" font-size="12">   name: varchar</text>
    <text x="20" y="155" fill="#e2e8f0" font-family="monospace" font-size="12">   default_branch: varchar</text>
  </g>

  <!-- Diagrams Table -->
  <g transform="translate(400, 50)">
    <rect width="250" height="200" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="250" height="35" rx="8" fill="#059669"/>
    <text x="20" y="24" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">diagrams</text>
    <text x="20" y="65" fill="#e2e8f0" font-family="monospace" font-size="12">PK id: uuid</text>
    <text x="20" y="95" fill="#e2e8f0" font-family="monospace" font-size="12">FK repository_id: uuid</text>
    <text x="20" y="125" fill="#e2e8f0" font-family="monospace" font-size="12">   source_path: varchar</text>
    <text x="20" y="155" fill="#e2e8f0" font-family="monospace" font-size="12">   diagram_type: varchar</text>
    <text x="20" y="185" fill="#e2e8f0" font-family="monospace" font-size="12">   confidence: numeric</text>
  </g>

  <!-- Relationship Connector Line -->
  <line x1="290" y1="140" x2="400" y2="140" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4"/>
  <text x="320" y="130" fill="#fbbf24" font-family="sans-serif" font-size="11">1 .. N</text>
</svg>
