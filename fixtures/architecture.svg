<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Group: Frontend Layer -->
  <rect x="50" y="50" width="200" height="400" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="80" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">Web Client Layer</text>
  <rect x="70" y="120" width="160" height="70" rx="8" fill="#334155" stroke="#60a5fa"/>
  <text x="90" y="160" fill="#ffffff" font-family="sans-serif" font-size="12">Next.js Web App</text>

  <!-- Arrow Frontend -> API Gateway -->
  <line x1="230" y1="155" x2="310" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="10">HTTPS/REST</text>

  <!-- Group: Core Backend Layer -->
  <rect x="300" y="50" width="220" height="400" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="320" y="80" fill="#6ee7b7" font-family="sans-serif" font-size="14" font-weight="bold">Core API Services</text>
  <rect x="320" y="120" width="180" height="60" rx="8" fill="#334155" stroke="#34d399"/>
  <text x="360" y="155" fill="#ffffff" font-family="sans-serif" font-size="12">API Gateway</text>

  <rect x="320" y="220" width="180" height="60" rx="8" fill="#334155" stroke="#34d399"/>
  <text x="345" y="255" fill="#ffffff" font-family="sans-serif" font-size="12">Diagram Analyzer</text>

  <!-- Group: Data Layer -->
  <rect x="550" y="50" width="200" height="400" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="570" y="80" fill="#fcd34d" font-family="sans-serif" font-size="14" font-weight="bold">Storage Cluster</text>
  <rect x="570" y="120" width="160" height="60" rx="8" fill="#334155" stroke="#fbbf24"/>
  <text x="600" y="155" fill="#ffffff" font-family="sans-serif" font-size="12">PostgreSQL DB</text>

  <rect x="570" y="220" width="160" height="60" rx="8" fill="#334155" stroke="#fbbf24"/>
  <text x="610" y="255" fill="#ffffff" font-family="sans-serif" font-size="12">Redis Queue</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
